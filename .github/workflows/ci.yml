name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-test:
    name: TypeScript typecheck & tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: pnpm

      - name: Install dependencies
        env:
          HOPPER_SKIP_GH_PLUGIN: "1"
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm build

      - name: Test (incl. C# source contract checks)
        run: pnpm test

      - name: Check browser and packaging scripts
        run: |
          bash -n scripts/install-rhino-mac.sh
          node --check src/host/static/app.js
          node --check scripts/install-grasshopper-plugin.mjs
          node --check scripts/package-rhino.mjs

  plugin-build:
    name: Rhino plug-ins (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: pnpm

      - name: Install dependencies
        env:
          HOPPER_SKIP_GH_PLUGIN: "1"
        run: pnpm install --frozen-lockfile

      - name: Build backend, GHA, and RHP
        run: dotnet build grasshopper-plugin/rhino-zmq-poc.sln -c Release

      - name: Test host ownership and readiness
        run: dotnet test grasshopper-plugin.Tests/grasshopper-plugin.Tests.csproj -c Release --filter "FullyQualifiedName~ConnectionProfileTests|FullyQualifiedName~HopperHostManagerTests|FullyQualifiedName~DocumentSnapshotsTests"

      - name: Stage and smoke-test Rhino package
        shell: bash
        run: |
          node scripts/package-rhino.mjs --output "$RUNNER_TEMP/hopper-yak-stage"
          node scripts/smoke-staged-host.mjs "$RUNNER_TEMP/hopper-yak-stage"
