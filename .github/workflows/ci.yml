name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-test:
    name: TypeScript typecheck & tests
    runs-on: ubuntu-latest

    # The Grasshopper plugin (grasshopper-plugin/**.cs) and its C# contract tests
    # (grasshopper-plugin.Tests/ApplyGraphContractTests.cs) require the Rhino/Grasshopper
    # runtime, which is Windows/macOS-only and not available on Linux runners. We
    # therefore do NOT build or run the .NET project here. Instead, the TypeScript
    # contract test (src/services/gh-apply-graph.contract.test.ts) statically asserts the
    # C# source contract (atomicity, failure-safe restore, timeout-as-unknown-outcome,
    # single-undo guard) so structural regressions are caught in CI.
    #
    # To run the C# contract tests locally on a Rhino-equipped machine:
    #   dotnet test grasshopper-plugin.Tests/grasshopper-plugin.Tests.csproj

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        env:
          HOPPER_SKIP_GH_PLUGIN: "1"
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm build

      - name: Test (incl. C# source contract checks)
        run: pnpm test
