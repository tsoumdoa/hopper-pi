name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-test:
    name: TypeScript typecheck & tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        env:
          HOPPER_SKIP_GH_PLUGIN: "1"
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm build

      - name: Test (incl. C# source contract checks)
        run: pnpm test

  shared-host-platform:
    name: Shared host contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install dependencies
        env:
          HOPPER_SKIP_GH_PLUGIN: "1"
        run: pnpm install --frozen-lockfile
      - name: Shared host control, storage, browser and scheduler contracts
        run: pnpm exec vitest run src/host/shared
      - name: Native ownership and document contracts
        run: dotnet test dotnet/Hopper.Core.Tests/Hopper.Core.Tests.csproj --configuration Release
      # These runners have no licensed Rhino UI. Packaged bootstrap, UI-thread
      # document behavior and geometry fidelity still require the native suite.
